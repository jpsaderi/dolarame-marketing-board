<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dolarame · Andamento de leads</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../shared.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'DM Sans', Arial, sans-serif;
    }

    h1 {
      margin: 0;
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .sub {
      color: var(--muted);
      margin-top: 4px;
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .last-updated {
      font-size: 12px;
      color: var(--muted);
    }

    .btn-refresh {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }

    .btn-refresh:hover {
      opacity: .88;
    }

    .btn-refresh:active {
      transform: scale(.97);
    }

    .btn-refresh:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .btn-refresh svg {
      width: 15px;
      height: 15px;
      transition: transform .6s ease;
    }

    .btn-refresh.loading svg {
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .webhook-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding: 14px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .webhook-bar label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #9a9891;
      white-space: nowrap;
    }

    .webhook-bar input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--divider);
      font-family: 'DM Sans', monospace;
      font-size: 13px;
      color: var(--muted);
      outline: none;
      cursor: not-allowed;
    }

    .webhook-lock {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .webhook-lock svg {
      width: 13px;
      height: 13px;
    }

    .badge-status {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .bs-ok {
      background: var(--success-soft);
      color: var(--success);
    }

    .bs-err {
      background: var(--error-soft);
      color: var(--error);
    }

    .bs-idle {
      background: rgba(111, 108, 101, .1);
      color: var(--muted);
    }

    .date-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex-wrap: wrap;
    }

    .date-bar label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #9a9891;
      white-space: nowrap;
    }

    .date-presets {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preset-btn {
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
    }

    .preset-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .preset-btn.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .date-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }

    .date-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .date-inputs span {
      font-size: 12px;
      color: var(--muted);
    }

    .date-input {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
      cursor: pointer;
    }

    .date-input:focus {
      border-color: var(--primary);
    }

    .date-range-label {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      margin-left: auto;
    }

    .date-range-label strong {
      color: var(--primary);
      font-weight: 700;
    }

    .account-selector {
      position: relative;
    }

    .account-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 240px;
      max-height: 280px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 8px;
      z-index: 30;
    }

    .account-dropdown.open {
      display: block;
    }

    .account-dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .account-dropdown-item:hover {
      background: var(--primary-soft);
    }

    .account-dropdown-item label {
      cursor: pointer;
      flex: 1;
      text-transform: none;
      letter-spacing: normal;
      font-weight: 500;
      color: var(--text);
    }

    .account-dropdown-item input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--primary);
    }

    .account-dropdown-divider {
      height: 1px;
      background: var(--divider);
      margin: 6px 0;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .kpi {
      padding: 20px;
    }

    .kpi .l {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: #9a9891;
      font-weight: 700;
    }

    .kpi .v {
      font-size: 24px;
      font-weight: 800;
      font-family: 'Syne', sans-serif;
      margin-top: 10px;
    }

    .kpi .m {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }

    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 800;
      margin: 30px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title .n {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .chart-card {
      padding: 18px 18px 10px;
    }

    .chart-card .ch-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .chart-card .ch-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      margin-bottom: 10px;
    }

    .chart-wrap {
      position: relative;
      height: 280px;
    }

    .chart-wrap.tall {
      height: 320px;
    }

    .funnel-card {
      padding: 20px 22px;
      margin-top: 6px;
    }

    .funnel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
    }

    /* ── Diagrama Sankey (Apache ECharts) ── */
    .sankey-container {
      width: 100%;
      min-height: 440px;
      overflow-x: auto;
    }

    .sankey-container svg {
      max-width: none;
    }

    .funnel-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 12px;
    }

    .state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 64px 24px;
      color: var(--muted);
      text-align: center;
    }

    .state-box svg {
      opacity: .35;
    }

    .state-box p {
      margin: 0;
      font-size: 15px;
    }

    .state-box small {
      font-size: 13px;
      opacity: .75;
    }

    .spinner-ring {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .skel {
      background: linear-gradient(90deg, #e8e6e1 25%, #f0ede8 50%, #e8e6e1 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
      height: 1em;
    }

    .skel-v {
      height: 1.6em;
      width: 70%;
      margin-top: 10px;
    }

    .skel-m {
      height: .9em;
      width: 90%;
      margin-top: 8px;
    }

    @keyframes shimmer {
      to {
        background-position: -200% 0;
      }
    }

    @media (max-width: 980px) {
      .dash {
        grid-template-columns: 1fr;
      }

      .side {
        display: none;
      }

      .kpis {
        grid-template-columns: repeat(2, 1fr);
      }

      .charts-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="dash">
    <aside class="side">
      <div class="logo">
        <img src="https://www.dolarame.com.br/wp-content/uploads/2022/11/dolarame_logo_verde-claro_verde-escuro.png"
          alt="Dolarame" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
        <span
          style="display:none; font-family:'Syne',sans-serif; font-size:18px; font-weight:800; color:var(--primary);">Dolarame</span>
      </div>
      <div data-shared-nav></div>
    </aside>

    <main class="main">
      <div class="top">
        <div>
          <h1>Andamento de leads</h1>
          <div class="sub" id="subtitle">Clique em Atualizar para buscar os dados do webhook.</div>
        </div>
        <div class="top-actions">
          <span class="last-updated" id="lastUpdated"></span>
          <button class="btn-refresh" id="btnRefresh" onclick="fetchData()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M23 4v6h-6" />
              <path d="M1 20v-6h6" />
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
            </svg>
            Atualizar
          </button>
        </div>
      </div>

      <div class="webhook-bar">
        <label>Webhook N8N</label>
        <input type="text" id="webhookUrl" readonly />
        <span class="webhook-lock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="10" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          fixo
        </span>
        <span class="badge-status bs-idle" id="statusBadge">Aguardando</span>
      </div>

      <div class="date-bar">
        <label>Período</label>
        <div class="date-presets">
          <button class="preset-btn" data-days="0">Hoje</button>
          <button class="preset-btn" data-days="6">7 dias</button>
          <button class="preset-btn" data-days="29">30 dias</button>
          <button class="preset-btn" data-days="89">90 dias</button>
          <button class="preset-btn active" id="btnMonthToDate">Este mês</button>
        </div>
        <div class="date-divider"></div>
        <div class="date-inputs">
          <input type="date" class="date-input" id="startDate" />
          <span>→</span>
          <input type="date" class="date-input" id="endDate" />
        </div>
        <div class="date-divider"></div>
        <div class="account-selector" id="accountSelector">
          <button class="preset-btn" type="button" onclick="toggleAccountDropdown()">
            <span id="accountSelectorLabel">Todas as contas</span> ▾
          </button>
          <div class="account-dropdown" id="accountDropdown">
            <div class="account-dropdown-item">
              <input type="checkbox" id="accountSelectAll" checked onchange="onSelectAllToggle(this)" />
              <label for="accountSelectAll"><strong>Selecionar todas</strong></label>
            </div>
            <div class="account-dropdown-divider"></div>
            <div id="accountCheckboxList"></div>
          </div>
        </div>
        <span class="date-range-label" id="dateRangeLabel"></span>
      </div>

      <div class="kpis" id="kpisArea">
        <div class="card kpi">
          <div class="l">Captados</div>
          <div class="skel skel-v"></div>
          <div class="skel skel-m"></div>
        </div>
        <div class="card kpi">
          <div class="l">WhatsApp válido</div>
          <div class="skel skel-v"></div>
          <div class="skel skel-m"></div>
        </div>
        <div class="card kpi">
          <div class="l">Reuniões agendadas</div>
          <div class="skel skel-v"></div>
          <div class="skel skel-m"></div>
        </div>
        <div class="card kpi">
          <div class="l">Vendas</div>
          <div class="skel skel-v"></div>
          <div class="skel skel-m"></div>
        </div>
      </div>

      <div id="contentArea">
        <div class="card">
          <div class="state-box">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 3h18v18H3z" rx="2" />
              <path d="M3 9h18M9 21V9" />
            </svg>
            <p>Nenhum dado carregado.</p>
            <small>Clique em Atualizar para buscar os dados do webhook.</small>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../shared-menu.js"></script>
  <script>
    const STATIC_WEBHOOK_URL = 'https://dolarame-n8n.up.railway.app/webhook/progress-insights';
    const brl = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const int = v => Number(v || 0).toLocaleString('pt-BR');
    const PALETTE = ['#01696f', '#a85600', '#437a22', '#a13544', '#5b4b8a', '#2f7a7a', '#7a3b2e', '#556b2f', '#8a4b6f', '#3a6ea5'];
    const withAlpha = (hex, a) => { const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return `rgba(${r},${g},${b},${a})`; };

    let chartInstances = {};
    let rawPayloads = [];
    let allAccountIds = [];
    let selectedAccountIds = new Set();
    let echartsInstance = null;

    function destroyChart(id) { if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; } }

    function accountKey(item) {
      return (item.account?.id || item.account?.name || 'default').toString();
    }

    function buildAccountOptions(payloads) {
      const map = new Map();
      payloads.forEach(item => {
        const key = accountKey(item);
        if (!map.has(key)) map.set(key, item.account?.name || 'Conta padrão');
      });
      return Array.from(map.entries()).map(([id, name]) => ({ id, name }));
    }

    function initAccountSelector(payloads) {
      const options = buildAccountOptions(payloads);
      allAccountIds = options.map(o => o.id);
      selectedAccountIds = new Set(allAccountIds);

      const list = document.getElementById('accountCheckboxList');
      list.innerHTML = options.map(opt => `
        <div class="account-dropdown-item">
          <input type="checkbox" class="account-checkbox" value="${opt.id}" id="acc-${opt.id}" checked />
          <label for="acc-${opt.id}">${opt.name}</label>
        </div>
      `).join('');

      list.querySelectorAll('.account-checkbox').forEach(cb => cb.addEventListener('change', onAccountCheckboxChange));
      document.getElementById('accountSelectAll').checked = true;
      updateAccountSelectorLabel(options);
    }

    async function onAccountCheckboxChange() {
      selectedAccountIds = new Set(Array.from(document.querySelectorAll('.account-checkbox:checked')).map(cb => cb.value));
      document.getElementById('accountSelectAll').checked = selectedAccountIds.size === allAccountIds.length;
      updateAccountSelectorLabel(buildAccountOptions(rawPayloads));
      await applyFiltersAndRender();
    }

    async function onSelectAllToggle(checkbox) {
      document.querySelectorAll('.account-checkbox').forEach(cb => { cb.checked = checkbox.checked; });
      selectedAccountIds = checkbox.checked ? new Set(allAccountIds) : new Set();
      updateAccountSelectorLabel(buildAccountOptions(rawPayloads));
      await applyFiltersAndRender();
    }

    function updateAccountSelectorLabel(options) {
      const label = document.getElementById('accountSelectorLabel');
      if (selectedAccountIds.size === 0) {
        label.textContent = 'Nenhuma conta';
      } else if (selectedAccountIds.size === allAccountIds.length) {
        label.textContent = 'Todas as contas';
      } else if (selectedAccountIds.size === 1) {
        const id = Array.from(selectedAccountIds)[0];
        const opt = options.find(o => o.id === id);
        label.textContent = opt ? opt.name : '1 conta';
      } else {
        label.textContent = `${selectedAccountIds.size} contas selecionadas`;
      }
    }

    function toggleAccountDropdown() {
      document.getElementById('accountDropdown').classList.toggle('open');
    }

    function closeAccountDropdown() {
      document.getElementById('accountDropdown').classList.remove('open');
    }

    function getFilteredPayloads() {
      if (allAccountIds.length === 0) return rawPayloads;
      return rawPayloads.filter(item => selectedAccountIds.has(accountKey(item)));
    }

    // Monta o layout completo (card do sankey + linhas de gráficos) em uma
    // única atribuição de innerHTML, para não destruir o gráfico ECharts
    // que será injetado depois via manipulação direta do DOM.
    function buildContentLayout(metrics) {
      document.getElementById('contentArea').innerHTML = `
        <div class="card funnel-card">
          <div class="funnel-header">
            <div>
              <div class="ch-title">Fluxo de progresso dos leads</div>
            </div>
            <div class="badge-status bs-ok">${int(metrics.totals.captured)} captados</div>
          </div>
          <div id="sankeyContainer" class="sankey-container">
            <div class="state-box">
              <div class="spinner-ring"></div>
              <p>Montando o diagrama…</p>
            </div>
          </div>
          <div class="funnel-note">A espessura de cada fluxo representa a quantidade de leads que percorreu aquele caminho.</div>
        </div>

        <div class="section-title"><span class="n">1</span> Captação por campanha e conjunto</div>
        <div class="charts-row">
          <div class="card chart-card">
            <div class="ch-title">Captação por campanha</div>
            <div class="ch-sub">Total de captações por campanha</div>
            <div class="chart-wrap"><canvas id="campaignChart"></canvas></div>
          </div>
          <div class="card chart-card">
            <div class="ch-title">Captação por conjunto</div>
            <div class="ch-sub">Total de captações por conjunto de anúncios</div>
            <div class="chart-wrap"><canvas id="setChart"></canvas></div>
          </div>
        </div>
        <div class="section-title"><span class="n">2</span> Captação por criativo</div>
        <div class="card chart-card">
          <div class="ch-title">Captação por criativo</div>
          <div class="ch-sub">Captações por anúncio/criativo</div>
          <div class="chart-wrap"><canvas id="creativeChart"></canvas></div>
        </div>
      `;
    }

    async function applyFiltersAndRender() {
      const filtered = getFilteredPayloads();
      const metrics = aggregateMetrics(filtered);
      renderKPIs(metrics);
      buildContentLayout(metrics);
      renderCharts(metrics);
      await renderSankey(metrics);
    }

    // ── Carregamento dinâmico do Chart.js (com fallback entre CDNs) ────
    const CHART_CDN_URLS = [
      'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js',
      'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
      'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js'
    ];
    let chartLoadPromise = null;
    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('Falha ao carregar ' + src));
        document.head.appendChild(s);
      });
    }
    async function ensureChartLoaded() {
      if (window.Chart) return;
      if (chartLoadPromise) return chartLoadPromise;
      chartLoadPromise = (async () => {
        let lastErr = null;
        for (const url of CHART_CDN_URLS) {
          try { await loadScriptOnce(url); if (window.Chart) return; } catch (e) { lastErr = e; }
        }
        throw new Error('Não foi possível carregar o Chart.js. ' + (lastErr ? lastErr.message : ''));
      })();
      return chartLoadPromise;
    }

    // ── Carregamento dinâmico do Apache ECharts (com fallback entre CDNs) ──
    const ECHARTS_CDN_URLS = [
      'https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js',
      'https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js',
      'https://unpkg.com/echarts@5/dist/echarts.min.js'
    ];
    let echartsLoadPromise = null;
    async function ensureEChartsLoaded() {
      if (window.echarts) return;
      if (echartsLoadPromise) return echartsLoadPromise;
      echartsLoadPromise = (async () => {
        let lastErr = null;
        for (const url of ECHARTS_CDN_URLS) {
          try { await loadScriptOnce(url); if (window.echarts) return; } catch (e) { lastErr = e; }
        }
        throw new Error('Não foi possível carregar o Apache ECharts. Verifique se o domínio cdnjs.cloudflare.com / cdn.jsdelivr.net / unpkg.com não está bloqueado neste ambiente.' + (lastErr ? ' Detalhe: ' + lastErr.message : ''));
      })();
      return echartsLoadPromise;
    }

    function normalizePayloads(raw) {
      let arr = Array.isArray(raw) ? raw : [raw];
      arr = arr.map(p => (p && p.json) ? p.json : p);
      const flat = [];
      arr.forEach(p => {
        if (!p) return;
        if (Array.isArray(p.data)) {
          p.data.forEach(item => flat.push(item));
        } else {
          flat.push(p);
        }
      });
      return flat.filter(p => p && p.campaign && p.ad_sets);
    }

    function aggregateMetrics(payloads) {
      const totals = {
        captured: 0,
        whatsapp: 0,
        noWhatsapp: 0,
        socialSeller: 0,
        repliedWhatsapp: 0,
        hot: 0,
        warm: 0,
        coldQualified: 0,
        coldDisqualified: 0,
        meetingScheduled: 0,
        meetingDone: 0,
        sold: 0,
        converted: 0,
        hotSold: 0,
        warmSold: 0,
        coldQualifiedSold: 0,
        coldDisqualifiedSold: 0,
        noQualificationSold: 0,
        // NOVO: mantidos apenas para eventuais KPIs futuros; o Sankey em si
        // não depende mais destes três campos, e sim de sankeyEdges abaixo.
        altaRendaContact: 0,
        socialSellerFromWhatsapp: 0,
        socialSellerFromNoWhatsapp: 0
      };
      const campaignMap = new Map();
      const setMap = new Map();
      const creativeMap = new Map();

      // NOVO: agrega os edges do Sankey (já vêm prontos do n8n) somando o
      // value de cada par source->target em todos os payloads filtrados.
      const edgeMap = new Map();
      const addEdgeValue = (source, target, value) => {
        const key = `${source}|||${target}`;
        if (!edgeMap.has(key)) edgeMap.set(key, { source, target, value: 0 });
        edgeMap.get(key).value += Number(value || 0);
      };

      function addValue(map, key, amount) {
        if (!map.has(key)) map.set(key, { label: key, value: 0 });
        map.get(key).value += Number(amount || 0);
      }

      payloads.forEach(item => {
        const setResume = item.ad_sets?.resume || {};
        totals.captured += Number(setResume.capturedCount || 0);
        totals.whatsapp += Number(setResume.hasWhatsappCount || 0);
        totals.noWhatsapp += Number(setResume.noWhatsappCount || 0);
        totals.socialSeller += Number(setResume.socialSellerContactCount || 0);
        totals.repliedWhatsapp += Number(setResume.repliedWhatsappCount || 0);
        totals.hot += Number(setResume.hotLeadCount || 0);
        totals.warm += Number(setResume.warmLeadCount || 0);
        totals.coldQualified += Number(setResume.coldQualifiedLeadCount || 0);
        totals.coldDisqualified += Number(setResume.coldDisqualifiedLeadCount || 0);
        totals.meetingScheduled += Number(setResume.meetingScheduledCount || 0);
        totals.meetingDone += Number(setResume.meetingDoneCount || 0);
        totals.sold += Number(setResume.soldCount || 0);
        totals.converted += Number(setResume.totalConverted || 0);

        totals.hotSold += Number(setResume.hotSoldCount || 0);
        totals.warmSold += Number(setResume.warmSoldCount || 0);
        totals.coldQualifiedSold += Number(setResume.coldQualifiedSoldCount || 0);
        totals.coldDisqualifiedSold += Number(setResume.coldDisqualifiedSoldCount || 0);
        totals.noQualificationSold += Number(setResume.noQualificationSoldCount || 0);

        // NOVO
        totals.altaRendaContact += Number(setResume.altaRendaContactCount || 0);
        totals.socialSellerFromWhatsapp += Number(setResume.socialSellerFromWhatsappCount || 0);
        totals.socialSellerFromNoWhatsapp += Number(setResume.socialSellerFromNoWhatsappCount || 0);

        // NOVO: soma os edges prontos deste ad set. Se o campo não existir
        // (payload antigo, antes da mudança no n8n), o Sankey simplesmente
        // fica vazio para este item — sem quebrar o restante do dashboard.
        const edges = item.ad_sets?.sankey?.edges || [];
        edges.forEach(e => addEdgeValue(e.source, e.target, e.value));

        addValue(campaignMap, item.campaign?.name || 'Sem campanha', setResume.capturedCount || 0);
        addValue(setMap, item.ad_sets?.name || 'Sem conjunto', setResume.capturedCount || 0);

        (item.ads || []).forEach(ad => {
          const adResume = ad.resume || {};
          addValue(creativeMap, ad.name || 'Sem criativo', adResume.capturedCount || 0);
        });
      });

      return {
        totals,
        sankeyEdges: Array.from(edgeMap.values()).filter(e => e.value > 0), // NOVO
        campaignSeries: Array.from(campaignMap.values()).sort((a, b) => b.value - a.value),
        setSeries: Array.from(setMap.values()).sort((a, b) => b.value - a.value),
        creativeSeries: Array.from(creativeMap.values()).sort((a, b) => b.value - a.value)
      };
    }
    function renderKPIs(metrics) {
      document.getElementById('kpisArea').innerHTML = `
        <div class="card kpi"><div class="l">Captados</div><div class="v">${int(metrics.totals.captured)}</div><div class="m">captações registradas</div></div>
        <div class="card kpi"><div class="l">WhatsApp válido</div><div class="v">${int(metrics.totals.whatsapp)}</div><div class="m">contatos com WhatsApp válido</div></div>
        <div class="card kpi"><div class="l">Reuniões agendadas</div><div class="v">${int(metrics.totals.meetingScheduled)}</div><div class="m">reuniões marcadas</div></div>
        <div class="card kpi"><div class="l">Vendas</div><div class="v">${int(metrics.totals.sold || metrics.totals.converted)}</div><div class="m">conversões fechadas</div></div>
      `;
    }

    // ── Diagrama Sankey do fluxo de leads (Apache ECharts) ──────────────
    // Fluxo em colunas por etapa: captação → WhatsApp válido / inválido
    // → respondeu mensagem / social seller → reunião → qualificação e compra.
    const SANKEY_NODE_COLORS = {
      'Captados': '#01696f',
      'WhatsApp válido': '#0f8c91',
      'WhatsApp inválido': '#a13544',
      'Contato com o Alta renda': '#c98f00',
      'Respondeu mensagem': '#9b6c00',
      'Contato com o Social Seller': '#b36b00',
      'Marcou reunião': '#a85600',
      'Reunião realizada': '#5b4b8a',
      'Quente': '#437a22',
      'Morno': '#7c9b27',
      'Frio qualificado': '#2f7a7a',
      'Frio desqualificado': '#7a3b2e',
      'Realizou compra': '#01696f'
    };
    function buildSankeyData(metrics) {
      const edges = (metrics.sankeyEdges || [])
        .map(e => ({
          source: e.source,
          target: e.target,
          value: Math.max(0, Math.round(e.value || 0))
        }))
        .filter(e => e.value > 0);

      const usedNames = new Set();
      edges.forEach(e => { usedNames.add(e.source); usedNames.add(e.target); });

      const nodes = Array.from(usedNames).map(name => ({
        name,
        x: getNodeX(name),
        y: getNodeY(name),
        itemStyle: { color: SANKEY_NODE_COLORS[name] || '#5b5850' }
      }));

      return { nodes, edges };
    }

    function getNodeX(name) {
      const columns = {
        'Captados': 0.02,
        'WhatsApp válido': 0.22,
        'WhatsApp inválido': 0.22,
        'Contato com o Alta renda': 0.38,      // NOVO: antes de "Respondeu mensagem"
        'Respondeu mensagem': 0.54,
        'Contato com o Social Seller': 0.54,
        'Marcou reunião': 0.71,
        'Reunião realizada': 0.84,
        'Quente': 0.96,
        'Morno': 0.96,
        'Frio qualificado': 0.96,
        'Frio desqualificado': 0.96,
        'Realizou compra': 0.96
      };
      return columns[name] ?? 0.5;
    }

    function getNodeY(name) {
      const rows = {
        'Captados': 0.5,
        'WhatsApp válido': 0.28,
        'WhatsApp inválido': 0.72,
        'Contato com o Alta renda': 0.18,     // acima, alimentando Respondeu por cima
        'Respondeu mensagem': 0.36,
        'Contato com o Social Seller': 0.55,
        'Marcou reunião': 0.45,
        'Reunião realizada': 0.45,
        'Quente': 0.12,
        'Morno': 0.34,
        'Frio qualificado': 0.56,
        'Frio desqualificado': 0.78,
        'Realizou compra': 0.9
      };
      return rows[name] ?? 0.5;
    }

    async function renderSankey(metrics) {
      const container = document.getElementById('sankeyContainer');
      if (!container) return;

      const data = buildSankeyData(metrics);

      if (data.edges.length === 0) {
        container.innerHTML = `
          <div class="state-box">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h18v18H3z" rx="2" /><path d="M3 9h18M9 21V9" /></svg>
            <p>Sem dados suficientes para montar o fluxo.</p>
            <small>Ajuste o período ou as contas selecionadas.</small>
          </div>`;
        return;
      }

      try {
        await ensureEChartsLoaded();
      } catch (err) {
        container.innerHTML = `
          <div class="state-box">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
            <p>Não foi possível carregar o diagrama.</p>
            <small>${err.message}</small>
          </div>`;
        return;
      }

      container.innerHTML = '';

      try {
        if (echartsInstance) { echartsInstance.dispose(); echartsInstance = null; }
        echartsInstance = echarts.init(container);

        const option = {
          backgroundColor: 'transparent',
          tooltip: {
            trigger: 'item',
            triggerOn: 'mousemove',
            backgroundColor: '#28251d',
            borderWidth: 0,
            padding: 10,
            textStyle: { color: '#f7f6f2', fontFamily: 'DM Sans', fontSize: 12 },
            formatter: (params) => {
              if (params.dataType === 'edge') {
                const v = int(params.data.value);
                return `<strong>${params.data.source}</strong> → <strong>${params.data.target}</strong><br/>${v} lead${params.data.value !== 1 ? 's' : ''}`;
              }
              return `<strong>${params.name}</strong>`;
            }
          },
          series: [{
            type: 'sankey',
            layout: 'none',
            nodeAlign: 'left',
            emphasis: { focus: 'adjacency' },
            nodeWidth: 18,
            nodeGap: 18,
            draggable: false,
            layoutIterations: 80,
            label: {
              color: '#28251d',
              fontFamily: 'DM Sans',
              fontWeight: 600,
              fontSize: 12
            },
            lineStyle: { color: 'gradient', curveness: 0.5, opacity: 0.35 },
            itemStyle: { borderWidth: 0 },
            data: data.nodes,
            links: data.edges
          }]
        };

        echartsInstance.setOption(option);
      } catch (err) {
        container.innerHTML = `
          <div class="state-box">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
            <p>Erro ao renderizar o diagrama.</p>
            <small>${err.message}</small>
          </div>`;
      }
    }

    window.addEventListener('resize', () => {
      if (echartsInstance) echartsInstance.resize();
    });

    // ── Gráficos de barra (Chart.js) ────────────────────────────────────
    function buildBarChart(canvasId, items, label, color) {
      destroyChart(canvasId);
      const ctx = document.getElementById(canvasId).getContext('2d');
      chartInstances[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: items.map(it => it.label),
          datasets: [{
            label,
            data: items.map(it => Number(it.value || 0)),
            backgroundColor: withAlpha(color, .55),
            borderColor: color,
            borderWidth: 1.5,
            borderRadius: 6,
            maxBarThickness: 42
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#28251d',
              padding: 10,
              titleFont: { family: 'DM Sans', weight: '700' },
              bodyFont: { family: 'DM Sans' },
              callbacks: {
                title: (ctxItems) => ctxItems[0]?.label || '',
                label: (item) => `${label}: ${int(item.raw)}`
              }
            }
          },
          scales: {
            y: { beginAtZero: true, ticks: { callback: v => int(v), font: { family: 'DM Sans', size: 11 } }, grid: { color: '#dcd9d5' } },
            x: {
              ticks: {
                font: { family: 'DM Sans', size: 11 },
                maxRotation: 0,
                minRotation: 0,
                autoSkip: true,
                callback: function (value) {
                  const label = this.getLabelForValue(value);
                  return label.length > 14 ? label.slice(0, 13) + '…' : label;
                }
              },
              grid: { display: false }
            }
          }
        }
      });
    }

    function renderCharts(metrics) {
      const campaignItems = metrics.campaignSeries.slice(0, 10);
      const setItems = metrics.setSeries.slice(0, 10);
      const creativeItems = metrics.creativeSeries.slice(0, 10);

      ensureChartLoaded().then(() => {
        buildBarChart('campaignChart', campaignItems, 'Captações', '#01696f');
        buildBarChart('setChart', setItems, 'Captações', '#a85600');
        buildBarChart('creativeChart', creativeItems, 'Captações', '#5b4b8a');
      }).catch(err => {
        ['campaignChart', 'setChart', 'creativeChart'].forEach(id => {
          const canvas = document.getElementById(id);
          if (canvas) {
            const wrap = canvas.closest('.chart-wrap');
            if (wrap) wrap.innerHTML = `<div class="state-box"><p>Erro ao carregar gráfico.</p><small>${err.message}</small></div>`;
          }
        });
      });
    }

    async function fetchData() {
      const btn = document.getElementById('btnRefresh');
      const badge = document.getElementById('statusBadge');
      const sub = document.getElementById('subtitle');

      btn.disabled = true;
      btn.classList.add('loading');
      badge.textContent = 'Carregando…';
      badge.className = 'badge-status bs-idle';

      document.getElementById('contentArea').innerHTML = `
        <div class="card">
          <div class="state-box">
            <div class="spinner-ring"></div>
            <p>Buscando dados no webhook…</p>
            <small>Isso pode levar alguns segundos.</small>
          </div>
        </div>
      `;
      document.getElementById('kpisArea').innerHTML = `
        <div class="card kpi"><div class="l">Captados</div><div class="skel skel-v"></div><div class="skel skel-m"></div></div>
        <div class="card kpi"><div class="l">WhatsApp válido</div><div class="skel skel-v"></div><div class="skel skel-m"></div></div>
        <div class="card kpi"><div class="l">Reuniões agendadas</div><div class="skel skel-v"></div><div class="skel skel-m"></div></div>
        <div class="card kpi"><div class="l">Vendas</div><div class="skel skel-v"></div><div class="skel skel-m"></div></div>
      `;

      try {
        await ensureChartLoaded();
        const res = await fetch(STATIC_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            source: 'dolarame-andamento',
            timestamp: new Date().toISOString(),
            startDate: document.getElementById('startDate').value,
            endDate: document.getElementById('endDate').value
          })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.json();
        rawPayloads = normalizePayloads(raw);
        if (rawPayloads.length === 0) throw new Error('Resposta sem dados válidos.');

        initAccountSelector(rawPayloads);
        await applyFiltersAndRender();

        const now = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('lastUpdated').textContent = `Atualizado às ${now}`;
        badge.textContent = 'OK';
        badge.className = 'badge-status bs-ok';
        sub.textContent = `${rawPayloads.length} item${rawPayloads.length !== 1 ? 's' : ''} carregado${rawPayloads.length !== 1 ? 's' : ''} do webhook.`;
      } catch (err) {
        document.getElementById('contentArea').innerHTML = `
          <div class="card">
            <div class="state-box">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
              <p>Erro ao buscar dados.</p>
              <small>${err.message}</small>
            </div>
          </div>
        `;
        document.getElementById('kpisArea').innerHTML = `
          <div class="card kpi"><div class="l">Captados</div><div class="v">—</div></div>
          <div class="card kpi"><div class="l">WhatsApp válido</div><div class="v">—</div></div>
          <div class="card kpi"><div class="l">Reuniões agendadas</div><div class="v">—</div></div>
          <div class="card kpi"><div class="l">Vendas</div><div class="v">—</div></div>
        `;
        badge.textContent = 'Erro';
        badge.className = 'badge-status bs-err';
        sub.textContent = 'Falha ao carregar dados.';
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }

    function toLocalISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function applyPreset(days) {
      const end = new Date();
      const start = new Date();
      start.setDate(start.getDate() - days);
      document.getElementById('startDate').value = toLocalISO(start);
      document.getElementById('endDate').value = toLocalISO(end);
      updateRangeLabel();
    }

    function applyMonthToDate() {
      const end = new Date();
      const start = new Date(end.getFullYear(), end.getMonth(), 1);
      document.getElementById('startDate').value = toLocalISO(start);
      document.getElementById('endDate').value = toLocalISO(end);
      updateRangeLabel();
    }

    function updateRangeLabel() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      const lbl = document.getElementById('dateRangeLabel');
      if (!start || !end) { lbl.innerHTML = ''; return; }
      const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
      const diffDays = Math.round((new Date(end) - new Date(start)) / 86400000) + 1;
      lbl.innerHTML = `<strong>${fmt(start)}</strong> até <strong>${fmt(end)}</strong> &nbsp;·&nbsp; ${diffDays} dia${diffDays !== 1 ? 's' : ''}`;
    }

    function syncPresetButtons() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      if (!start || !end) return;
      const today = new Date(); today.setHours(0, 0, 0, 0);

      let anyDaysMatch = false;
      document.querySelectorAll('.preset-btn[data-days]').forEach(btn => {
        const d = parseInt(btn.dataset.days);
        const expectedStart = new Date(today);
        expectedStart.setDate(today.getDate() - d);
        const matches = toLocalISO(expectedStart) === start && toLocalISO(today) === end;
        btn.classList.toggle('active', matches);
        if (matches) anyDaysMatch = true;
      });

      const monthBtn = document.getElementById('btnMonthToDate');
      if (monthBtn) {
        const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
        const isMonthToDate = toLocalISO(monthStart) === start && toLocalISO(today) === end;
        monthBtn.classList.toggle('active', isMonthToDate && !anyDaysMatch);
      }
    }

    function onDateChange() {
      updateRangeLabel();
      syncPresetButtons();
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      if (start && end && start <= end) fetchData();
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('webhookUrl').value = STATIC_WEBHOOK_URL;

      const savedStart = localStorage.getItem('dolarame_andamento_start_date');
      const savedEnd = localStorage.getItem('dolarame_andamento_end_date');
      if (savedStart && savedEnd) {
        document.getElementById('startDate').value = savedStart;
        document.getElementById('endDate').value = savedEnd;
        updateRangeLabel();
        syncPresetButtons();
      } else {
        applyMonthToDate();
      }

      document.querySelectorAll('.preset-btn[data-days]').forEach(btn => {
        btn.addEventListener('click', () => {
          const days = parseInt(btn.dataset.days);
          applyPreset(days);
          document.querySelectorAll('.preset-btn[data-days], #btnMonthToDate').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          fetchData();
        });
      });

      const monthBtn = document.getElementById('btnMonthToDate');
      if (monthBtn) {
        monthBtn.addEventListener('click', () => {
          applyMonthToDate();
          document.querySelectorAll('.preset-btn[data-days], #btnMonthToDate').forEach(b => b.classList.remove('active'));
          monthBtn.classList.add('active');
          fetchData();
        });
      }

      document.getElementById('startDate').addEventListener('change', () => {
        localStorage.setItem('dolarame_andamento_start_date', document.getElementById('startDate').value);
        onDateChange();
      });
      document.getElementById('endDate').addEventListener('change', () => {
        localStorage.setItem('dolarame_andamento_end_date', document.getElementById('endDate').value);
        onDateChange();
      });

      fetchData();
    });

    document.addEventListener('click', (e) => {
      const selector = document.getElementById('accountSelector');
      if (selector && !selector.contains(e.target)) {
        closeAccountDropdown();
      }
    });
  </script>
